<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Айтиграм — E2E</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#5468ff">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --bg-color: #f5f7fb;
            --card-bg: #ffffff;
            --text-primary: #222;
            --text-secondary: #666;
            --border-color: #e0e4f0;
            --msg-own-bg: #dcf8c6;
            --msg-other-bg: #f0f2f5;
            --sidebar-bg: #ffffff;
            --input-bg: #ffffff;
            --hover-light: #f5f7fb;
            --primary: #5468ff;
            --primary-hover: #4256e0;
            --unread-badge: #ff4757;
        }
        body.dark {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --msg-own-bg: #2563eb;
            --msg-other-bg: #334155;
            --sidebar-bg: #1e293b;
            --input-bg: #0f172a;
            --hover-light: #1e293b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            height: 100vh; height: 100dvh;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .header {
            background: var(--card-bg); padding: 8px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0; z-index: 100;
        }
        .logo-area { display: flex; align-items: center; }
        .custom-logo { height: 40px; width: auto; max-width: 180px; object-fit: contain; }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .theme-btn {
            background: none; border: 1px solid var(--border-color);
            color: var(--text-primary); font-size: 1.1rem; cursor: pointer;
            padding: 5px 8px; border-radius: 18px; background: var(--card-bg);
        }
        .profile-link {
            display: flex; align-items: center; gap: 5px;
            color: var(--text-primary); text-decoration: none;
            font-size: 0.85rem; padding: 4px 10px;
            border-radius: 14px; border: 1px solid var(--border-color);
        }
        .avatar-small { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
        .logout {
            display: flex; align-items: center; gap: 4px;
            background: #fee2e2; color: #dc2626; text-decoration: none;
            font-size: 0.8rem; font-weight: 500; padding: 5px 10px;
            border-radius: 16px; border: 1px solid #fecaca;
        }
        body.dark .logout { background: #450a0a; color: #fca5a5; border-color: #7f1d1d; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar {
            width: 300px; background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color); padding: 12px;
            display: flex; flex-direction: column; flex-shrink: 0;
        }
        .chat-list { margin-top: 10px; overflow-y: auto; flex: 1; }
        .chat-item {
            padding: 10px; margin-bottom: 5px; background: var(--hover-light);
            border-radius: 10px; cursor: pointer; border: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        .chat-item:hover, .chat-item.active { background: var(--primary); color: white; }
        .chat-item-name { font-weight: 600; display: flex; align-items: center; gap: 6px; justify-content: space-between; font-size: 0.9rem; }
        .chat-item-preview { font-size: 0.8rem; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chat-item.active .chat-item-preview { color: rgba(255,255,255,0.8); }
        .unread-badge {
            background: var(--unread-badge); color: white; font-size: 0.6rem;
            padding: 2px 6px; border-radius: 10px; display: none; min-width: 18px; text-align: center;
        }
        .unread-badge.show { display: inline-block; }
        #search-area { display: flex; gap: 5px; margin-bottom: 10px; }
        #search-input {
            flex: 1; padding: 8px 10px; border: 1px solid var(--border-color);
            border-radius: 8px; font-size: 0.85rem; background: var(--input-bg);
            color: var(--text-primary); outline: none;
        }
        #search-btn {
            padding: 8px 12px; background: var(--primary); color: white;
            border: none; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
        }
        .user-btn {
            text-align: left; padding: 8px 10px; background: var(--hover-light);
            color: var(--text-primary); border: 1px solid var(--border-color);
            border-radius: 8px; cursor: pointer; margin-bottom: 4px;
            display: flex; align-items: center; gap: 6px; font-size: 0.85rem; width: 100%;
        }
        .user-btn:hover { background: var(--primary); color: white; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-color); }
        .chat-header {
            padding: 10px 16px; background: var(--card-bg);
            border-bottom: 1px solid var(--border-color); font-weight: 600;
            display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;
        }
        .chat-header-left { display: flex; align-items: center; gap: 6px; }
        .chat-header-avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
        .chat-header-username { color: var(--text-primary); text-decoration: none; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
        .back-btn {
            display: none; background: none; border: none;
            color: var(--primary); font-size: 1.4rem; cursor: pointer; padding: 2px 6px;
        }
        .encrypted-badge { background: #ffd700; color: #333; font-size: 0.6rem; padding: 2px 6px; border-radius: 10px; font-weight: 600; }
        .typing-indicator { color: var(--primary); font-size: 0.7rem; font-style: italic; animation: pulse 1.5s infinite; margin-left: 4px; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .chat-messages {
            flex: 1; overflow-y: auto; padding: 16px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .chat-messages.has-wallpaper { background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed; }
        .msg {
            max-width: 70%; padding: 8px 12px; border-radius: 14px;
            line-height: 1.4; position: relative; animation: fadeIn 0.2s ease; font-size: 0.9rem;
        }
        @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
        .msg.own { align-self: flex-end; background: var(--msg-own-bg); border-bottom-right-radius: 4px; }
        .msg.other { align-self: flex-start; background: var(--msg-other-bg); border-bottom-left-radius: 4px; }
        .msg.deleted { opacity: 0.4; font-style: italic; }
        .msg-header { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 3px; display: flex; justify-content: space-between; }
        .msg-content { word-break: break-word; white-space: pre-wrap; }
        .msg-status { font-size: 0.65rem; margin-top: 2px; text-align: right; }
        .msg-status.read { color: #4fc3f7; }
        .delete-btn {
            display: none; position: absolute; top: -8px; right: -8px;
            background: #ff4757; color: white; border: none; border-radius: 50%;
            width: 20px; height: 20px; font-size: 0.7rem; cursor: pointer; z-index: 5;
        }
        .msg.own:hover .delete-btn { display: block; }
        .msg.own { overflow: visible; }
        .avatar-mini { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; }
        .sticker-msg img { width: 100px; height: 100px; object-fit: contain; cursor: pointer; border-radius: 8px; }
        .file-msg { display: flex; align-items: center; gap: 6px; padding: 6px; background: var(--hover-light); border-radius: 8px; cursor: pointer; }
        .msg-content img { max-width: 220px; max-height: 220px; border-radius: 8px; cursor: pointer; }
        .file-icon { font-size: 1.5rem; }
        .file-name { font-weight: 600; font-size: 0.8rem; }
        .chat-input-area {
            display: flex; gap: 6px; padding: 10px 16px;
            background: var(--card-bg); border-top: 1px solid var(--border-color);
            flex-shrink: 0; position: relative;
        }
        #msg-input {
            flex: 1; padding: 10px 14px; border: 1px solid var(--border-color);
            border-radius: 20px; font-size: 0.9rem; outline: none;
            background: var(--input-bg); color: var(--text-primary);
        }
        #send-btn, #emoji-btn, #file-btn, #sticker-btn {
            padding: 10px 14px; background: none; border: 1px solid var(--border-color);
            border-radius: 20px; cursor: pointer; font-size: 1.1rem; color: var(--text-primary);
        }
        #send-btn { background: var(--primary); color: white; border: none; padding: 10px 20px; }
        #emoji-picker {
            display: none; position: absolute; bottom: 60px; left: 16px;
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 8px; width: 260px; z-index: 1000;
        }
        #emoji-picker .emoji-grid { display: flex; flex-wrap: wrap; gap: 3px; max-height: 180px; overflow-y: auto; }
        #emoji-picker .emoji-item {
            cursor: pointer; font-size: 1.3rem; padding: 5px; border-radius: 6px;
            text-align: center; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
        }
        #sticker-panel {
            display: none; position: absolute; bottom: 60px; left: 16px; right: 16px;
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 10px; z-index: 1000; max-height: 300px; overflow-y: auto;
        }
        .sticker-grid { display: flex; flex-wrap: wrap; gap: 6px; }
        .sticker-grid img { width: 65px; height: 65px; object-fit: contain; cursor: pointer; border-radius: 6px; padding: 3px; }
        .pack-tabs { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; font-size: 0.75rem; }
        .pack-tab { padding: 4px 10px; border-radius: 14px; cursor: pointer; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-primary); }
        .pack-tab.active { background: var(--primary); color: white; }
        .add-sticker-btn { padding: 4px 10px; background: var(--primary); color: white; border: none; border-radius: 14px; cursor: pointer; font-size: 0.75rem; }
        .traffic-note { font-size: 0.7rem; color: var(--text-secondary); text-align: center; padding: 6px; background: var(--card-bg); border-top: 1px solid var(--border-color); flex-shrink: 0; }
        .hidden { display: none !important; }
        .empty-state { text-align: center; color: var(--text-secondary); padding: 40px 20px; }

        /* Мобильная версия */
        @media (max-width: 768px) {
            .sidebar { width: 100% !important; }
            #search-area { display: flex !important; }
            .chat-area { display: none; }
            .chat-area.fullscreen-mobile { display: flex !important; position: absolute; left: 0; top: 0; bottom: 0; right: 0; z-index: 30; }
            .back-btn.show { display: inline-block !important; }
            .msg { max-width: 85% !important; }
            .msg-content img { max-width: 150px !important; max-height: 150px !important; }
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
    </style>
</head>
<body data-user-id="{{ session.get('user_id', 0) }}" data-username="{{ username }}">
    <header class="header">
        <div class="logo-area"><img class="custom-logo" src="/static/logo.png" alt="Логотип"></div>
        <div class="header-actions">
            <button class="theme-btn" id="theme-toggle">🌙</button>
            <button class="theme-btn" id="wallpaper-btn" title="Обои чата">🖼️</button>
            <input type="file" id="wallpaper-input" accept="image/*" style="display:none;">
            <a href="/profile" class="profile-link">
                <img src="/static/avatars/default.png" class="avatar-small" id="header-avatar" onerror="this.src='/static/avatars/default.png'">
                {{ username }}
            </a>
            <a href="/logout" class="logout">🚪</a>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar" id="sidebar">
            <div id="search-area">
                <input type="text" id="search-input" placeholder="Поиск...">
                <button id="search-btn">🔍</button>
            </div>
            <div id="user-list"></div>
            <div class="chat-list" id="chat-list"></div>
        </aside>

        <main class="chat-area" id="chat-area">
            <div id="chat-header" class="hidden">
                <div class="chat-header-left">
                    <button class="back-btn" id="back-btn" onclick="goBack()">←</button>
                    <img src="/static/avatars/default.png" class="chat-header-avatar" id="chat-avatar" onerror="this.src='/static/avatars/default.png'">
                    <a href="/profile/" class="chat-header-username" id="chat-username-link">...</a>
                    <span id="typing-indicator" class="typing-indicator" style="display:none;">печатает...</span>
                </div>
                <span class="encrypted-badge">🔐 E2EE</span>
            </div>

            <div id="chat-messages" class="chat-messages">
                <div class="empty-state" id="empty-state">
                    <p style="font-size:2rem;">💬</p>
                    <p>Выбери чат слева</p>
                </div>
            </div>

            <div id="chat-input-area" class="chat-input-area hidden">
                <button id="emoji-btn">😊</button>
                <button id="sticker-btn">⭐</button>
                <button id="file-btn">📎</button>
                <input type="text" id="msg-input" placeholder="Сообщение..." disabled>
                <button id="send-btn" disabled>➤</button>
                <input type="file" id="file-input" style="display:none;" accept="image/*,.pdf,.doc,.txt,.zip">
                <input type="file" id="add-sticker-input" style="display:none;" accept="image/webp,image/png">
                <div id="emoji-picker"><div class="emoji-grid"></div></div>
                <div id="sticker-panel">
                    <h4 style="font-size:0.8rem;margin-bottom:6px;">🎯 Стикеры</h4>
                    <div class="pack-tabs" id="pack-tabs"></div>
                    <div class="sticker-grid" id="sticker-grid"></div>
                    <button class="add-sticker-btn" id="create-pack-btn">+ Новый стикерпак</button>
                </div>
            </div>
            <div class="traffic-note">🔒 Сообщения зашифрованы</div>
        </main>
    </div>

    <script>
        // Звуки
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio(){ if(!audioCtx) audioCtx = new AudioContext(); }
        function playTypingSound(){
            if(!audioCtx) return;
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'sine';
            o.frequency.setValueAtTime(800, audioCtx.currentTime);
            o.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.05);
            g.gain.setValueAtTime(0.08, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            o.start(audioCtx.currentTime); o.stop(audioCtx.currentTime + 0.05);
        }
        function playReceiveSound(){
            if(!audioCtx) return;
            const now = audioCtx.currentTime;
            [600, 800].forEach((freq, i) => {
                const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.connect(g); g.connect(audioCtx.destination);
                o.type = 'sine';
                o.frequency.setValueAtTime(freq, now + i * 0.1);
                g.gain.setValueAtTime(0.12, now + i * 0.1);
                g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.1);
                o.start(now + i * 0.1); o.stop(now + i * 0.1 + 0.1);
            });
        }

        // Тема
        (function(){
            const b = document.getElementById('theme-toggle'), d = document.body;
            if(localStorage.getItem('theme') === 'dark'){ d.classList.add('dark'); b.textContent = '☀️'; }
            b.addEventListener('click', () => {
                initAudio();
                d.classList.toggle('dark');
                const is = d.classList.contains('dark');
                localStorage.setItem('theme', is ? 'dark' : 'light');
                b.textContent = is ? '☀️' : '🌙';
            });
        })();

        // Обои
        document.getElementById('wallpaper-btn').addEventListener('click', () => document.getElementById('wallpaper-input').click());
        document.getElementById('wallpaper-input').addEventListener('change', function(){
            const f = this.files[0];
            if(!f) return;
            const fd = new FormData(); fd.append('wallpaper', f);
            fetch('/api/wallpaper', { method: 'POST', body: fd })
                .then(r => r.json())
                .then(d => {
                    if(d.url){
                        localStorage.setItem('wallpaper_url', d.url);
                        document.getElementById('chat-messages').style.backgroundImage = `url(${d.url})`;
                        document.getElementById('chat-messages').classList.add('has-wallpaper');
                    }
                });
            this.value = '';
        });
        const savedBg = localStorage.getItem('wallpaper_url');
        if(savedBg){
            document.getElementById('chat-messages').style.backgroundImage = `url(${savedBg})`;
            document.getElementById('chat-messages').classList.add('has-wallpaper');
        }

        // Кнопка назад (мобилка)
        function goBack(){
            document.getElementById('chat-area').classList.remove('fullscreen-mobile');
            document.getElementById('back-btn').classList.remove('show');
        }

        // Основные переменные
        const CURRENT_USER = document.body.dataset.username;
        const CURRENT_USER_ID = parseInt(document.body.dataset.userId);
        const socket = io();
        let currentReceiverId = parseInt(sessionStorage.getItem('chat_receiver_id')) || null;
        let currentReceiverName = sessionStorage.getItem('chat_receiver_name') || null;
        const CHATS_KEY = `active_chats_${CURRENT_USER_ID}`;
        const UNREAD_KEY = `unread_counts_${CURRENT_USER_ID}`;

        // Очистка старых чатов при смене пользователя
        const lastUser = localStorage.getItem('last_user_id');
        if(lastUser && parseInt(lastUser) !== CURRENT_USER_ID){
            localStorage.removeItem(`active_chats_${lastUser}`);
            localStorage.removeItem(`unread_counts_${lastUser}`);
        }
        localStorage.setItem('last_user_id', CURRENT_USER_ID);

        let activeChats = JSON.parse(localStorage.getItem(CHATS_KEY) || '[]');
        let unreadCounts = JSON.parse(localStorage.getItem(UNREAD_KEY) || '{}');
        let typingTimeout, currentPackId = null;

        // Загрузка своей аватарки
        fetch(`/api/user/${CURRENT_USER_ID}`)
            .then(r => r.json())
            .then(d => {
                if(d.avatar) document.getElementById('header-avatar').src = `/static/avatars/${d.avatar}`;
            });

        // Эмодзи
        const emojis = ['😀','😂','🥰','😎','🤔','👍','❤️','🔥','💯','✨','🎉','💪','🙏','😢','😡','🤯','🥳','😴','🤗','👋','🌟','💫','⭐','💎','🚀','🎵','🍕','☕','🎁','👑'];
        function initEmojiPicker(){
            const picker = document.getElementById('emoji-picker');
            const grid = picker.querySelector('.emoji-grid');
            const btn = document.getElementById('emoji-btn');
            const input = document.getElementById('msg-input');
            emojis.forEach(e => {
                const span = document.createElement('span');
                span.className = 'emoji-item';
                span.textContent = e;
                span.addEventListener('click', () => {
                    input.value += e;
                    picker.style.display = 'none';
                    input.focus();
                });
                grid.appendChild(span);
            });
            btn.addEventListener('click', e => {
                initAudio();
                e.stopPropagation();
                const visible = picker.style.display === 'block';
                picker.style.display = visible ? 'none' : 'block';
                document.getElementById('sticker-panel').style.display = 'none';
            });
        }

        // Стикеры
        function initStickers(){
            const stickerBtn = document.getElementById('sticker-btn');
            const stickerPanel = document.getElementById('sticker-panel');
            const addInput = document.getElementById('add-sticker-input');

            stickerBtn.addEventListener('click', e => {
                initAudio();
                e.stopPropagation();
                const visible = stickerPanel.style.display === 'block';
                stickerPanel.style.display = visible ? 'none' : 'block';
                document.getElementById('emoji-picker').style.display = 'none';
                if(!visible) loadStickerPacks();
            });

            document.getElementById('create-pack-btn').addEventListener('click', () => {
                const name = prompt('Название стикерпака:', 'Мои стикеры');
                if(!name) return;
                fetch('/api/stickers/create_pack', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name })
                })
                .then(r => r.json())
                .then(p => {
                    currentPackId = p.id;
                    loadStickerPacks();
                });
            });

            addInput.addEventListener('change', function(){
                const file = this.files[0];
                if(!file || !currentPackId) return;
                const fd = new FormData();
                fd.append('sticker', file);
                fd.append('emoji', '⭐');
                fetch(`/api/stickers/add_to_pack/${currentPackId}`, { method: 'POST', body: fd })
                    .then(() => loadStickersInPack(currentPackId));
                this.value = '';
            });

            document.addEventListener('click', e => {
                if(!stickerPanel.contains(e.target) && e.target !== stickerBtn)
                    stickerPanel.style.display = 'none';
                const ep = document.getElementById('emoji-picker');
                if(!ep.contains(e.target) && e.target !== document.getElementById('emoji-btn'))
                    ep.style.display = 'none';
            });
        }

        function loadStickerPacks(){
            fetch('/api/stickers/packs')
                .then(r => r.json())
                .then(packs => {
                    const tabs = document.getElementById('pack-tabs');
                    tabs.innerHTML = '';
                    packs.forEach(p => {
                        const tab = document.createElement('span');
                        tab.className = 'pack-tab' + (p.id === currentPackId ? ' active' : '');
                        tab.textContent = p.name + ' (' + p.count + ')';
                        tab.addEventListener('click', () => {
                            currentPackId = p.id;
                            loadStickersInPack(p.id);
                            document.querySelectorAll('.pack-tab').forEach(t => t.classList.remove('active'));
                            tab.classList.add('active');
                        });
                        tabs.appendChild(tab);
                    });
                    const addBtn = document.createElement('button');
                    addBtn.className = 'add-sticker-btn';
                    addBtn.textContent = '+';
                    addBtn.title = 'Добавить стикер';
                    addBtn.addEventListener('click', e => {
                        e.stopPropagation();
                        if(!currentPackId){ alert('Сначала выбери стикерпак!'); return; }
                        document.getElementById('add-sticker-input').click();
                    });
                    tabs.appendChild(addBtn);
                    if(packs.length > 0 && !currentPackId){
                        currentPackId = packs[0].id;
                        loadStickersInPack(packs[0].id);
                    }
                });
        }

        function loadStickersInPack(packId){
            fetch(`/api/stickers/pack/${packId}`)
                .then(r => r.json())
                .then(stickers => {
                    const grid = document.getElementById('sticker-grid');
                    grid.innerHTML = '';
                    if(!stickers.length){
                        grid.innerHTML = '<p style="color:var(--text-secondary);font-size:0.8rem;padding:8px;">Пока пусто</p>';
                        return;
                    }
                    stickers.forEach(s => {
                        const img = document.createElement('img');
                        img.src = s.url;
                        img.addEventListener('click', () => {
                            sendSticker(s.id);
                            document.getElementById('sticker-panel').style.display = 'none';
                        });
                        grid.appendChild(img);
                    });
                });
        }

        function sendSticker(sid){
            if(!currentReceiverId) return;
            socket.emit('send_sticker', { receiver_id: currentReceiverId, sticker_id: sid });
            const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            addStickerMessage(CURRENT_USER, `/api/stickers/${sid}`, true, time);
        }

        socket.on('receive_sticker', data => {
            if(data.sender_id === CURRENT_USER_ID) return;
            playReceiveSound();
            updateChatList(data.sender_id, data.sender_username, '⭐ Стикер');
            addUnreadCount(data.sender_id);
            if(currentReceiverId === data.sender_id)
                addStickerMessage(data.sender_username, data.sticker_url, false, data.timestamp);
        });

        function addStickerMessage(sender, url, isOwn, time){
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'msg sticker-msg ' + (isOwn ? 'own' : 'other');
            div.innerHTML = '<div class="msg-header"><strong>' + escapeHtml(sender) + '</strong><span>' + time + '</span></div><div class="msg-content"><img src="' + url + '"></div>';
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // Файлы
        function initFileUpload(){
            document.getElementById('file-btn').addEventListener('click', () => {
                initAudio();
                document.getElementById('file-input').click();
            });
            document.getElementById('file-input').addEventListener('change', function(){
                const file = this.files[0];
                if(!file || !currentReceiverId) return;
                const fd = new FormData();
                fd.append('file', file);
                fd.append('receiver_id', currentReceiverId);
                const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                if(file.type.startsWith('image/')){
                    const reader = new FileReader();
                    reader.onload = e => addFileMessage(CURRENT_USER, file.name, file.type, true, true, time, null, false, e.target.result, null);
                    reader.readAsDataURL(file);
                } else {
                    addFileMessage(CURRENT_USER, file.name, file.type, false, true, time, null, false, null, null);
                }
                fetch('/api/upload', { method: 'POST', body: fd });
                this.value = '';
            });
        }

        function escapeHtml(text){
            if(!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getAvatarHtml(avatar){
            return '<img src="/static/avatars/' + (avatar || 'default.png') + '" class="avatar-mini" onerror="this.src=\'/static/avatars/default.png\'">';
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            renderChatList();
            initEmojiPicker();
            initFileUpload();
            initStickers();
            if(currentReceiverId) restoreChat(currentReceiverId, currentReceiverName);
        });
        document.addEventListener('click', initAudio, { once: true });

        // Список чатов
        function renderChatList(){
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            if(!activeChats.length){
                list.innerHTML = '<p style="color:var(--text-secondary);text-align:center;padding:15px;font-size:0.85rem;">Нет активных чатов</p>';
                return;
            }
            activeChats.forEach(chat => {
                const unread = unreadCounts[chat.id] || 0;
                const div = document.createElement('div');
                div.className = 'chat-item' + (chat.id === currentReceiverId ? ' active' : '');
                div.innerHTML = '<div class="chat-item-name"><span><img src="/static/avatars/default.png" class="avatar-mini" onerror="this.src=\'/static/avatars/default.png\'"> ' + escapeHtml(chat.name) + '</span><span class="unread-badge ' + (unread > 0 ? 'show' : '') + '">' + (unread || '') + '</span></div><div class="chat-item-preview">' + (chat.lastMessage ? escapeHtml(chat.lastMessage) : 'Нет сообщений') + '</div>';
                div.addEventListener('click', () => {
                    unreadCounts[chat.id] = 0;
                    localStorage.setItem(UNREAD_KEY, JSON.stringify(unreadCounts));
                    openChat(chat.id, chat.name);
                });
                list.appendChild(div);
            });
        }

        function updateChatList(rid, rname, msg){
            if(rid === CURRENT_USER_ID) return;
            const idx = activeChats.findIndex(c => c.id === rid);
            if(idx !== -1){
                activeChats[idx].lastMessage = msg;
                activeChats.unshift(activeChats.splice(idx, 1)[0]);
            } else {
                activeChats.unshift({ id: rid, name: rname, lastMessage: msg });
            }
            localStorage.setItem(CHATS_KEY, JSON.stringify(activeChats));
            renderChatList();
        }

        function addUnreadCount(sid){
            if(sid === currentReceiverId) return;
            unreadCounts[sid] = (unreadCounts[sid] || 0) + 1;
            localStorage.setItem(UNREAD_KEY, JSON.stringify(unreadCounts));
            renderChatList();
        }

        // Чат
        function restoreChat(rid, uname){
            currentReceiverId = rid;
            currentReceiverName = uname;
            unreadCounts[rid] = 0;
            localStorage.setItem(UNREAD_KEY, JSON.stringify(unreadCounts));

            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('chat-header').classList.remove('hidden');
            document.getElementById('chat-input-area').classList.remove('hidden');
            document.getElementById('typing-indicator').style.display = 'none';
            document.getElementById('msg-input').disabled = false;
            document.getElementById('send-btn').disabled = false;
            document.getElementById('chat-messages').innerHTML = '';

            // Мобильная версия
            if(window.innerWidth <= 768){
                document.getElementById('chat-area').classList.add('fullscreen-mobile');
                document.getElementById('back-btn').classList.add('show');
            }

            fetch(`/api/user/${rid}`)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('chat-avatar').src = `/static/avatars/${data.avatar || 'default.png'}`;
                    document.getElementById('chat-username-link').textContent = uname;
                    document.getElementById('chat-username-link').href = `/profile/${rid}`;
                })
                .catch(() => {
                    document.getElementById('chat-avatar').src = '/static/avatars/default.png';
                    document.getElementById('chat-username-link').textContent = uname;
                    document.getElementById('chat-username-link').href = `/profile/${rid}`;
                });

            socket.emit('join_chat', { receiver_id: rid });
            loadMessageHistory(rid);
            document.getElementById('msg-input').focus();
            renderChatList();
        }

        function searchUsers(){
            const query = document.getElementById('search-input').value.trim();
            if(!query) return;
            fetch(`/api/search?q=${encodeURIComponent(query)}`)
                .then(r => r.json())
                .then(users => {
                    const list = document.getElementById('user-list');
                    list.innerHTML = '';
                    if(!users.length){
                        list.innerHTML = '<p style="color:var(--text-secondary);text-align:center;padding:10px;">Никого не найдено</p>';
                        return;
                    }
                    users.forEach(u => {
                        const btn = document.createElement('button');
                        btn.className = 'user-btn';
                        btn.innerHTML = '<img src="/static/avatars/' + (u.avatar || 'default.png') + '" class="avatar-small" onerror="this.src=\'/static/avatars/default.png\'"> ' + escapeHtml(u.username);
                        btn.addEventListener('click', () => {
                            openChat(u.id, u.username);
                            list.innerHTML = '';
                            document.getElementById('search-input').value = '';
                        });
                        list.appendChild(btn);
                    });
                });
        }

        function openChat(rid, uname){
            sessionStorage.setItem('chat_receiver_id', rid);
            sessionStorage.setItem('chat_receiver_name', uname);
            restoreChat(rid, uname);
        }

        function loadMessageHistory(rid){
            fetch(`/api/messages/${rid}`)
                .then(r => r.json())
                .then(messages => {
                    messages.forEach(msg => {
                        const isOwn = msg.sender_id === CURRENT_USER_ID;
                        if(msg.type === 'file'){
                            addFileMessage(msg.sender_username, msg.file_name, msg.file_type, msg.is_image, isOwn, msg.timestamp, msg.id, msg.read, msg.is_image ? msg.file_url : null, msg.sender_avatar);
                        } else {
                            addMessage(msg.sender_username, msg.text, isOwn, msg.timestamp, msg.id, msg.read, msg.sender_avatar);
                        }
                    });
                    messages.forEach(msg => {
                        if(msg.sender_id !== CURRENT_USER_ID && !msg.read)
                            socket.emit('message_read', { message_id: msg.id, type: msg.type || 'text' });
                    });
                });
        }

        function sendMessage(){
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if(!text || !currentReceiverId) return;
            const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            addMessage(CURRENT_USER, text, true, time, null, false, null);
            socket.emit('send_message', { receiver_id: currentReceiverId, message: text });
            input.value = '';
        }

        // Индикатор печати
        const msgInput = document.getElementById('msg-input');
        let lastKeyTime = 0;
        msgInput.addEventListener('input', () => {
            if(!currentReceiverId) return;
            initAudio();
            if(Date.now() - lastKeyTime > 150){
                playTypingSound();
                lastKeyTime = Date.now();
            }
            clearTimeout(typingTimeout);
            socket.emit('typing', { receiver_id: currentReceiverId, is_typing: true });
            typingTimeout = setTimeout(() => {
                socket.emit('typing', { receiver_id: currentReceiverId, is_typing: false });
            }, 1500);
        });

        socket.on('user_typing', data => {
            if(data.sender_id === currentReceiverId)
                document.getElementById('typing-indicator').style.display = data.is_typing ? 'inline' : 'none';
        });

        // Сокеты
        socket.on('receive_message', data => {
            if(data.sender_id === CURRENT_USER_ID) return;
            playReceiveSound();
            updateChatList(data.sender_id, data.sender_username, data.text);
            addUnreadCount(data.sender_id);
            if(currentReceiverId === data.sender_id){
                addMessage(data.sender_username, data.text, false, data.timestamp, data.id, data.read, data.sender_avatar);
                socket.emit('message_read', { message_id: data.id, type: 'text' });
            }
        });

        socket.on('file_received', data => {
            if(data.sender_id === CURRENT_USER_ID) return;
            playReceiveSound();
            const preview = data.is_image ? '📷 Фото' : '📎 ' + data.file_name;
            updateChatList(data.sender_id, data.sender_username, preview);
            addUnreadCount(data.sender_id);
            if(currentReceiverId === data.sender_id){
                addFileMessage(data.sender_username, data.file_name, data.file_type, data.is_image, false, data.timestamp, data.id, data.read, data.is_image ? data.file_url : null, data.sender_avatar);
                socket.emit('message_read', { message_id: data.id, type: 'file' });
            }
        });

        socket.on('message_read_by', data => {
            const el = document.querySelector(`[data-msg-id="${data.message_id}"]`);
            if(!el) return;
            const status = el.querySelector('.msg-status');
            if(status){
                status.textContent = '✓✓';
                status.classList.add('read');
                status.classList.remove('unread');
            }
        });

        socket.on('message_deleted', data => {
            const el = document.querySelector(`[data-msg-id="${data.message_id}"]`);
            if(!el) return;
            el.querySelector('.msg-content').innerHTML = '<em>🗑️ Сообщение удалено</em>';
            el.classList.add('deleted');
            const btn = el.querySelector('.delete-btn');
            if(btn) btn.remove();
        });

        // Добавление сообщений в DOM
        function addMessage(sender, text, isOwn, time, msgId, read, av){
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'msg ' + (isOwn ? 'own' : 'other');
            if(msgId) div.dataset.msgId = msgId;

            const avatarHtml = !isOwn ? getAvatarHtml(av) : '';
            const statusHtml = isOwn ? '<div class="msg-status ' + (read ? 'read' : 'unread') + '">' + (read ? '✓✓' : '✓') + '</div>' : '';
            const deleteBtn = (isOwn && msgId) ? '<button class="delete-btn" onclick="event.stopPropagation(); deleteMsg(' + msgId + ',\'text\')">✕</button>' : '';

            div.innerHTML = '<div class="msg-header">' + avatarHtml + '<strong>' + escapeHtml(sender) + '</strong><span>' + time + '</span></div><div class="msg-content">' + escapeHtml(text) + '</div>' + statusHtml + deleteBtn;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addFileMessage(sender, fn, ft, isImg, isOwn, time, msgId, read, fileUrl, av){
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'msg ' + (isOwn ? 'own' : 'other');
            if(msgId) div.dataset.msgId = msgId;

            const avatarHtml = !isOwn ? getAvatarHtml(av) : '';
            const statusHtml = isOwn ? '<div class="msg-status ' + (read ? 'read' : 'unread') + '">' + (read ? '✓✓' : '✓') + '</div>' : '';
            const deleteBtn = (isOwn && msgId) ? '<button class="delete-btn" onclick="event.stopPropagation(); deleteMsg(' + msgId + ',\'file\')">✕</button>' : '';

            let content;
            if(isImg && fileUrl){
                content = '<img src="' + fileUrl + '" alt="' + escapeHtml(fn) + '" onclick="window.open(\'' + fileUrl + '\')">';
            } else {
                const icon = (ft && ft.includes('pdf')) ? '📄' : '📁';
                content = '<div class="file-msg" onclick="window.open(\'' + (fileUrl || '#') + '\')"><span class="file-icon">' + icon + '</span><span class="file-name">' + escapeHtml(fn) + '</span></div>';
            }

            div.innerHTML = '<div class="msg-header">' + avatarHtml + '<strong>' + escapeHtml(sender) + '</strong><span>' + time + '</span></div><div class="msg-content">' + content + '</div>' + statusHtml + deleteBtn;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // Удаление сообщений
        window.deleteMsg = function(msgId, type){
            if(!confirm('Удалить сообщение у обоих?')) return;
            const url = type === 'text' ? '/api/message/' + msgId + '/delete' : '/api/file/' + msgId + '/delete';
            fetch(url, { method: 'POST' });
            const el = document.querySelector('[data-msg-id="' + msgId + '"]');
            if(!el) return;
            el.querySelector('.msg-content').innerHTML = '<em>🗑️ Сообщение удалено</em>';
            el.classList.add('deleted');
            const btn = el.querySelector('.delete-btn');
            if(btn) btn.remove();
        };

        // Обработчики кнопок
        document.getElementById('search-input').addEventListener('keypress', e => {
            if(e.key === 'Enter') searchUsers();
        });
        document.getElementById('msg-input').addEventListener('keypress', e => {
            if(e.key === 'Enter') sendMessage();
        });
        document.getElementById('search-btn').addEventListener('click', searchUsers);
        document.getElementById('send-btn').addEventListener('click', sendMessage);
    </script>
</body>
</html>
