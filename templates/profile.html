<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль</title>
    <style>
        :root {
            --bg-color: #f5f7fb;
            --card-bg: #ffffff;
            --text-primary: #222222;
            --text-secondary: #666666;
            --border-color: #e0e4f0;
            --primary: #5468ff;
            --primary-hover: #4256e0;
        }
        body.dark {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .profile-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }
        .avatar-container {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 15px;
            overflow: hidden;
            border: 3px solid var(--primary);
            position: relative;
            cursor: pointer;
        }
        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .avatar-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 4px;
            font-size: 0.7rem;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .avatar-container:hover .avatar-overlay { opacity: 1; }
        .username {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .bio-input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            background: var(--card-bg);
            color: var(--text-primary);
            resize: vertical;
            min-height: 60px;
            margin-bottom: 15px;
            font-family: inherit;
        }
        .btn {
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            margin: 4px;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn-back {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        .btn-back:hover { background: var(--border-color); }
        .theme-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <button class="theme-btn" id="theme-toggle">🌙</button>

    <div class="profile-card">
        <div class="avatar-container" onclick="document.getElementById('avatar-input').click()">
            <img src="/static/avatars/{{ user.avatar }}" alt="Аватар" id="avatar-img">
            <div class="avatar-overlay">Сменить фото</div>
        </div>
        <input type="file" id="avatar-input" accept="image/*" style="display:none;">

        <div class="username">👤 {{ user.username }}</div>

        <textarea class="bio-input" id="bio-input" placeholder="Напишите что-нибудь о себе...">{{ user.bio }}</textarea>

        <button class="btn" onclick="saveProfile()">💾 Сохранить</button>
        <a href="/chat" class="btn btn-back">← Назад в чат</a>
    </div>

    <script>
        (function() {
            const themeBtn = document.getElementById('theme-toggle');
            const body = document.body;
            if (localStorage.getItem('theme') === 'dark') {
                body.classList.add('dark');
                themeBtn.textContent = '☀️';
            }
            themeBtn.addEventListener('click', () => {
                body.classList.toggle('dark');
                const isDark = body.classList.contains('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                themeBtn.textContent = isDark ? '☀️' : '🌙';
            });
        })();

        document.getElementById('avatar-input').addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('avatar-img').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function saveProfile() {
            const form = new FormData();
            form.append('bio', document.getElementById('bio-input').value);

            const avatarFile = document.getElementById('avatar-input').files[0];
            if (avatarFile) {
                form.append('avatar', avatarFile);
            }

            fetch('/api/profile/update', {
                method: 'POST',
                body: form
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'ok') {
                    alert('Профиль обновлён! ✅');
                }
            });
        }
    </script>
</body>
</html>
