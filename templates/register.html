<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <style>
        :root {
            --primary: #5468ff;
            --primary-hover: #4256e0;
            --bg: #f5f7fb;
            --card: #fff;
            --text: #222;
            --text-muted: #666;
            --border: #e0e4f0;
            --error: #e74c3c;
        }
        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.2s, color 0.2s;
            position: relative;
        }
        .theme-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 20px;
            transition: all 0.2s;
        }
        .theme-btn:hover {
            background: var(--bg);
        }
        .auth-card {
            background: var(--card);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
          .logo-area {
         display: flex;
         align-items: center;
         justify-content: center;
         margin-bottom: 25px;
        }

          /* === ЛОГОТИП === */
          .custom-logo {
         height: 100px;
         width: auto;
         max-width: 320px;
         object-fit: contain;
         image-rendering: -webkit-optimize-contrast;
         image-rendering: crisp-edges;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.95rem;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            background: var(--card);
            color: var(--text);
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: var(--primary);
        }
        .error {
            background: #ffebee;
            color: var(--error);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            text-align: center;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: var(--primary-hover);
        }
        .switch {
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
        }
        .switch a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        .switch a:hover {
            text-decoration: underline;
        }
        .traffic-note {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <button class="theme-btn" id="theme-toggle" title="Сменить тему">🌙</button>
    <div class="auth-card">
        <div class="logo-area">
            <!-- === ВАШЕ ЛОГО === -->
            <img class="custom-logo" src="/static/logo.png" alt="Логотип">
        </div>

        {% if error %}
            <div class="error">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST" action="/register">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Придумайте ник" autocomplete="username" minlength="3" maxlength="20">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Придумайте пароль" autocomplete="new-password" minlength="6">
            </div>
            <button type="submit" class="btn">Создать аккаунт ➤</button>
        </form>

        <div class="switch">
            Уже есть аккаунт? <a href="/login">Войти</a>
        </div>
        <div class="traffic-note">
            [АНАЛИЗАТОР ТРАФИКА]: Ключ шифрования генерируется локально • Данные защищены
        </div>
    </div>

    <script>
        (function() {
            const themeBtn = document.getElementById('theme-toggle');
            const body = document.body;
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                body.classList.add('dark');
                themeBtn.textContent = '☀️';
            }
            themeBtn.addEventListener('click', () => {
                body.classList.toggle('dark');
                const isDark = body.classList.contains('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                themeBtn.textContent = isDark ? '☀️' : '🌙';
            });
        })();
    </script>
</body>
</html>
