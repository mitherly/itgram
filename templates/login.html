<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Айтиграм — Вход</title>
    <style>
        :root {
            --primary: #5468ff;
            --primary-hover: #4256e0;
            --bg: #f5f7fb;
            --card: #fff;
            --text: #222;
            --text-muted: #666;
            --border: #e0e4f0;
            --error: #e74c3c;
        }
        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.2s, color 0.2s;
            position: relative;
        }
        .theme-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 20px;
        }
        .auth-card {
            background: var(--card);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .custom-logo {
            height: 80px;
            width: auto;
            max-width: 280px;
            object-fit: contain;
        }
        .mode-switch {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 18px;
        }
        .mode-btn {
            padding: 7px 16px;
            border-radius: 18px;
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            background: var(--card);
            color: var(--text);
            transition: all 0.2s;
        }
        .mode-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.95rem;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            background: var(--card);
            color: var(--text);
            transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: var(--primary); }
        .error {
            background: #ffebee;
            color: var(--error);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            text-align: center;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: var(--primary-hover); }
        .switch {
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
        }
        .switch a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        .switch a:hover { text-decoration: underline; }
        .traffic-note {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <button class="theme-btn" id="theme-toggle" title="Сменить тему">🌙</button>
    <div class="auth-card">
        <div class="logo-area">
            <img class="custom-logo" src="/static/logo.png" alt="Логотип">
        </div>

        <div class="mode-switch">
            <button class="mode-btn active" id="mode-desktop" onclick="setMode('desktop')">🖥️ ПК</button>
            <button class="mode-btn" id="mode-mobile" onclick="setMode('mobile')">📱 Телефон</button>
            <button class="mode-btn" id="mode-auto" onclick="setMode('auto')">🔄 Авто</button>
        </div>

        {% if error %}
            <div class="error">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Введите ваш ник" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Введите пароль" autocomplete="current-password">
            </div>
            <button type="submit" class="btn">Войти ➤</button>
        </form>

        <div class="switch">
            Нет аккаунта? <a href="/register">Зарегистрироваться</a>
        </div>
        <div class="traffic-note">
            [АНАЛИЗАТОР ТРАФИКА]: Вход защищён • Пароли хешируются
        </div>
    </div>

    <script>
        (function() {
            const themeBtn = document.getElementById('theme-toggle');
            const body = document.body;
            if (localStorage.getItem('theme') === 'dark') {
                body.classList.add('dark');
                themeBtn.textContent = '☀️';
            }
            themeBtn.addEventListener('click', () => {
                body.classList.toggle('dark');
                const isDark = body.classList.contains('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                themeBtn.textContent = isDark ? '☀️' : '🌙';
            });
        })();

        function setMode(mode) {
            localStorage.setItem('display_mode', mode);
            location.reload();
        }

        const savedMode = localStorage.getItem('display_mode') || 'auto';
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        if (savedMode === 'desktop') document.getElementById('mode-desktop').classList.add('active');
        else if (savedMode === 'mobile') document.getElementById('mode-mobile').classList.add('active');
        else document.getElementById('mode-auto').classList.add('active');
    </script>
</body>
</html>
